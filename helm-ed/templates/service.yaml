# This file is a template to expose the piveau-hub-repo application as a Kubernetes service.
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "piveau-hub-repo.name" . }}
  labels:
    {{- include "piveau-hub-repo.labels" . | nindent 4 }}
spec:
  # The type of the service (e.g., ClusterIP, NodePort, LoadBalancer)
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # The port on the container to which the service should forward traffic
      targetPort: {{ .Values.containerPort }}
      # Protocol used by the service
      protocol: TCP
      # Name of the port, useful for service discovery and monitoring
      name: http
  # The selector labels to identify the pods that the service should target
  selector:
    {{- include "piveau-hub-repo.selectorLabels" . | nindent 4 }}
