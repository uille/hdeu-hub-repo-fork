# Define a Kubernetes ServiceAccount if the creation flag is set in values
---
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "piveau-hub-repo.serviceAccountName" . }}
  labels:
    # Labels for the ServiceAccount
    {{- include "piveau-hub-repo.labels" . | nindent 4 }}
  # Annotations for the ServiceAccount, included if present in values
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---
{{- if .Values.virtuoso.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "piveau-hub-repo.virtuosoServiceAccountName" . }}
  labels:
    {{- include "piveau-hub-repo.labels" . | nindent 4 }}
  {{- with .Values.virtuoso.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---
{{- if .Values.shadowVirtuoso.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "piveau-hub-repo.shadowVirtuosoServiceAccountName" . }}
  labels:
    {{- include "piveau-hub-repo.labels" . | nindent 4 }}
  {{- with .Values.shadowVirtuoso.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}