# This file is a template to expose the virtuoso application as a Kubernetes service.
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "piveau-hub-repo.virtuosoName" . }}
  labels:
    {{- include "piveau-hub-repo.virtuosoLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # The ports that the service should expose
  ports:
    - name: default
      port: {{ .Values.virtuoso.service.port.default }}
      targetPort: {{ .Values.virtuoso.containerPort.default }}
      protocol: TCP
    - name: service
      port: {{ .Values.virtuoso.service.port.service }}
      targetPort: {{ .Values.virtuoso.containerPort.service }}
      protocol: TCP
  # The selector labels to identify the pods that the service should target
  selector:
    {{- include "piveau-hub-repo.virtuosoSelectorLabels" . | nindent 4 }}