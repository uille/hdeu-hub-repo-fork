# This ConfigMap includes the environmental variables that are used by the application, e.g JAVA_OPTS, HUB_STORE_DATA_UPLOAD_URL, VIRTUOSO_CONFIG_URL, etc.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "piveau-hub-repo.name" . }}-configmap
data:
  {{- range $key, $value := .Values.config }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}