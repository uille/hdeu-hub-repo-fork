# This file is a template for the Role resource in Kubernetes.
# This role binding allows the service account to read pods in the corresponding namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "piveau-hub-repo.name" . }}-pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "piveau-hub-repo.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "piveau-hub-repo.name" . }}-pod-reader
  apiGroup: rbac.authorization.k8s.io
