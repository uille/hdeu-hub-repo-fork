# This file is a template for the Kubernetes Ingress object.
---
{{- if .Values.shadowVirtuoso.ingress.enabled -}}
  {{- $fullName := include "piveau-hub-repo.shadowVirtuosoName" . -}}
  {{- $svcPort := .Values.shadowVirtuoso.service.port -}}
  {{- if and .Values.shadowVirtuoso.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.shadowVirtuoso.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.shadowVirtuoso.ingress.annotations "kubernetes.io/ingress.class" .Values.shadowVirtuoso.ingress.className}}
  {{- end }}
  {{- end }}
  {{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
  {{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
  {{- else -}}
apiVersion: extensions/v1beta1
  {{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "piveau-hub-repo.shadowVirtuosoLabels" . | nindent 4 }}
  {{- with .Values.shadowVirtuoso.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.shadowVirtuoso.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.shadowVirtuoso.ingress.className }}
  {{- end }}
  {{- if .Values.shadowVirtuoso.ingress.tls }}
  tls:
    {{- range .Values.shadowVirtuoso.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.shadowVirtuoso.ingress.hosts.host }}
      http:
        paths:
          - path: {{ .Values.shadowVirtuoso.ingress.hosts.paths.path }}
            pathType: {{ .Values.shadowVirtuoso.ingress.hosts.paths.pathType }}
            backend:
              service:
                name: {{ .Values.shadowVirtuoso.ingress.hosts.backend.service.name }}
                port:
                  number:  {{ .Values.shadowVirtuoso.ingress.hosts.backend.service.port }}
  {{- end }}
