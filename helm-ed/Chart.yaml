# This helm chart is used to deploy the HDEU Hub Repo service in a Kubernetes cluster.

# API version of the chart, for Helm 3 this should be v2
apiVersion: v2
# The name of the chart
name: healthdataeu-piveau-hub-repo
# A brief description of what this chart does
description: A Helm chart to deploy the HDEU Hub Repo service

# The type of chart, either 'application' for deployable applications or 'library' for reusable chart utilities
type: application

# The version of the chart itself, following Semantic Versioning
version: 0.0.1

# The version of the application being deployed
appVersion: "0.0.1"

maintainers:
  - name: European Dynamics SA
