services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    logging:
      options:
        max-size: "50m"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      #- indices.query.bool.max_clause_count=850
      - ES_JAVA_OPTS=-Xms2G -Xmx4G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
      - 9300:9300

  virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.13-alpine
    logging:
      options:
        max-size: "50m"
    volumes:
      - virtuoso_db:/opt/virtuoso-opensource/var/lib/virtuoso/db
    ports:
      - 8890:8890
      - 1111:1111
    environment:
      - DBA_PASSWORD=dba


  shadow-virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.13-alpine
    logging:
      options:
        max-size: "50m"
    volumes:
      - shadow_virtuoso_db:/opt/virtuoso-opensource/var/lib/virtuoso/db
    ports:
      - 9890:8890
      - 9111:1111
    environment:
      - DBA_PASSWORD=dba

volumes:
  virtuoso_db:
  shadow_virtuoso_db:
  elasticsearch:


